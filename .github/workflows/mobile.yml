# Builds the Trade English phone app (Mobile/) for both platforms on every push that touches it:
#   - iOS:     an unsigned TradeEnglish.ipa, to install with Sideloadly (it signs with your Apple ID)
#   - Android: TradeEnglish.apk, signed with the debug key, to install directly on the phone
# Download both from the run's "Artifacts" section. Run it by hand from the Actions tab too.
# Build errors are also published as annotations on the run, readable without signing in.
name: Build mobile app

on:
  push:
    paths:
      - "Mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  # a newer push waits for the running build instead of cancelling it half way
  cancel-in-progress: false

jobs:
  ios:
    name: iOS (IPA)
    # macos-26 carries the newest Xcode 26.x releases (26.6 at the time of writing). Xcode 26.3
    # on macos-15 failed to compile expo-modules-jsi ("sending 'slot' risks causing data races").
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: Mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mobile/package-lock.json

      - name: Select newest stable Xcode
        run: |
          echo "Installed:"; ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE "beta|release_candidate|_rc" | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version
          echo "Using $(xcodebuild -version | head -1)"
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install packages
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: Mobile/ios
        run: pod install

      - name: Build app (unsigned)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          # the full log goes to build.log; the step fails when xcodebuild fails
          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          STATUS=$?
          set -e
          grep -E "BUILD (SUCCEEDED|FAILED)" build.log || true
          echo "xcodebuild exit status: $STATUS"
          exit $STATUS

      - name: Report iOS build errors
        if: failure()
        run: |
          touch build.log
          grep -E "error:|xcodebuild: error" build.log | sort -u | head -10 | while IFS= read -r line; do
            echo "::error title=iOS build::${line:0:900}"
          done
          tail -40 build.log | while IFS= read -r line; do
            echo "::notice title=iOS log tail::${line:0:900}"
          done
          {
            echo "### iOS build errors"
            echo '```'
            grep -E "error:|xcodebuild: error" build.log | sort -u | head -60
            echo '```'
            echo "### Last 80 lines of the build log"
            echo '```'
            tail -80 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/$SCHEME.app"
          if [ ! -x "$APP/$SCHEME" ]; then
            echo "::error title=iOS package::the app has no executable at $APP"
            ls -la "$APP" || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TradeEnglish.ipa Payload
          SIZE=$(stat -f%z TradeEnglish.ipa)
          echo "IPA size: $SIZE bytes"
          if [ "$SIZE" -lt 5000000 ]; then
            echo "::error title=iOS package::IPA is only $SIZE bytes"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TradeEnglish-ios-ipa
          path: Mobile/TradeEnglish.ipa
          retention-days: 14
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: Mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mobile/package-lock.json

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: Mobile/android
        # arm64-v8a covers every phone sold in the last several years and halves the build time
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon 2>&1 | tee ../gradle.log

      - name: Report Android build errors
        if: failure()
        run: |
          touch gradle.log
          grep -E "error:|What went wrong" -A2 gradle.log | grep -v "^--$" | head -10 | while IFS= read -r line; do
            echo "::error title=Android build::${line:0:900}"
          done
          {
            echo "### Android build errors"
            echo '```'
            grep -E "error:|FAILED|What went wrong" -A3 gradle.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TradeEnglish.apk
          ls -lh TradeEnglish.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeEnglish-android-apk
          path: Mobile/TradeEnglish.apk
          retention-days: 14
          if-no-files-found: error
