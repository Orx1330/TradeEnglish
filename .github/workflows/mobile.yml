# Builds the Trade English phone app (Mobile/) for both platforms on every push that touches it:
#   - iOS:     an unsigned TradeEnglish.ipa, to install with Sideloadly (it signs with your Apple ID)
#   - Android: TradeEnglish.apk, signed with the debug key, to install directly on the phone
# Download both from the run's "Artifacts" section. Run it by hand from the Actions tab too.
name: Build mobile app

on:
  push:
    paths:
      - "Mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (IPA)
    # If this runner label is unavailable, try macos-26 or macos-latest.
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: Mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mobile/package-lock.json

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE "beta|release_candidate|_rc" | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install packages
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: Mobile/ios
        run: pod install

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          test -d "build/Build/Products/Release-iphoneos/$SCHEME.app"

      - name: Show compile errors
        if: failure()
        run: |
          echo "### iOS compile errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" build.log | sort -u | head -60 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/$SCHEME.app" Payload/
          zip -qry TradeEnglish.ipa Payload
          ls -lh TradeEnglish.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TradeEnglish-ios-ipa
          path: Mobile/TradeEnglish.ipa
          retention-days: 14

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: Mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mobile/package-lock.json

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: Mobile/android
        # arm64-v8a covers every phone sold in the last several years and halves the build time
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon 2>&1 | tee ../gradle.log

      - name: Show build errors
        if: failure()
        run: |
          echo "### Android build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|FAILED|What went wrong" -A3 gradle.log | head -80 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TradeEnglish.apk
          ls -lh TradeEnglish.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeEnglish-android-apk
          path: Mobile/TradeEnglish.apk
          retention-days: 14
